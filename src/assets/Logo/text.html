<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="div1">
        <h1>hello bhi</h1>
    </div>
    <script>
        function change(){
            let element =document.querySelector(".div1");
            element.textContent="hel nhu";

        }
        let element =document.querySelector(".div1");
        element.addEventListener("click",change);
        
    </script>
</body>
</html>
